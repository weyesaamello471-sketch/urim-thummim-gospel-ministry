name: Build Urim Thummim Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap --version

      - name: Configure Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"

          bubblewrap updateConfig \
            --jdkPath="$JAVA_HOME" \
            --androidSdkPath="$ANDROID_SDK_ROOT"

          echo "Bubblewrap config:"
          cat "$HOME/.bubblewrap/config.json"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_SDK_ROOT"
          test -d "$ANDROID_SDK_ROOT/build-tools"
          test -d "$ANDROID_SDK_ROOT/platform-tools"
          test -d "$ANDROID_SDK_ROOT/platforms"

          ls -la "$ANDROID_SDK_ROOT"

      - name: Bubblewrap Doctor
        run: |
          bubblewrap doctor

      - name: Validate PWA
        run: |
          bubblewrap validate \
            --url=https://weyesaamello471-sketch.github.io/urim-thummim-gospel-ministry/

      - name: Success
        run: |
          echo "Bubblewrap and Android SDK are configured successfully."
          echo "PWA validation completed successfully."
