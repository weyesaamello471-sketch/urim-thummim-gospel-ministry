name: Build Urim Thummim Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap --version

      - name: Configure Bubblewrap
        run: |
          printf "n\n" | bubblewrap updateConfig --jdkPath="$JAVA_HOME" || true

      - name: Validate PWA
        run: |
          printf "n\n" | bubblewrap validate \
            --url=https://weyesaamello471-sketch.github.io/urim-thummim-gospel-ministry/

      - name: Success
        run: echo "PWA validation completed successfully"
